version: "3.9"

services:
  backend:
    build: .
    container_name: zzeta_backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: zzeta_super_secreto
      DB_PATH: /app/data/zzeta.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    restart: always
