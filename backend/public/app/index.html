<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZZETA Apps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Sora:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #080808;
        --bg-soft: #121212;
        --line: #2b2b2b;
        --text: #f5f5f5;
        --muted: #b9b9b9;
        --accent: #ffe100;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 0%, rgba(255, 225, 0, 0.14), transparent 35%),
          radial-gradient(circle at 80% 100%, rgba(255, 225, 0, 0.1), transparent 30%),
          var(--bg);
        color: var(--text);
        font-family: 'Sora', sans-serif;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .wrap {
        width: min(420px, 100%);
        background: linear-gradient(160deg, rgba(18, 18, 18, 0.95), rgba(9, 9, 9, 0.95));
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 0;
        font-family: 'Orbitron', sans-serif;
        font-size: 24px;
        letter-spacing: 1px;
      }

      p {
        margin: 8px 0 20px;
        color: var(--muted);
      }

      .apps {
        display: grid;
        gap: 12px;
      }

      .app-link {
        display: block;
        text-decoration: none;
        color: inherit;
        padding: 16px;
        border-radius: 16px;
        border: 1px solid #333;
        background: #0f0f0f;
      }

      .app-link strong {
        display: block;
        font-size: 16px;
      }

      .app-link span {
        font-size: 13px;
        color: var(--muted);
      }

      .app-link.primary {
        border-color: rgba(255, 225, 0, 0.45);
        box-shadow: inset 0 0 0 1px rgba(255, 225, 0, 0.08);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>ZZETA APPS</h1>
      <p>Selecciona la app conectada al backend.</p>
      <div class="apps">
        <a class="app-link primary" href="./barber/">
          <strong>App Barbero</strong>
          <span>Resumen, calendario y control de bot.</span>
        </a>
        <a class="app-link" href="./client/">
          <strong>App Cliente</strong>
          <span>Proximamente.</span>
        </a>
      </div>
    </main>
  </body>
</html>
